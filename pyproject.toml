[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "experiment-datadefinitions"
version = "0.1.0"
description = "Minimal Python skeleton with Pydantic and pytest."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
